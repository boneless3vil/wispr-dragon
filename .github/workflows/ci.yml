name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint & Test
    runs-on: ${{ matrix.os }}
    env:
      # PyQt6 widget tests construct a QApplication; the runners are headless,
      # so force Qt's offscreen platform plugin (no X/Wayland display needed).
      QT_QPA_PLATFORM: offscreen
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            %LocalAppData%\\pip\\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,client]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check (mypy) - optional
        shell: bash
        run: |
          if command -v mypy >/dev/null 2>&1; then
            mypy --strict wispr_dragon || true
          else
            echo "mypy not installed, skipping"
          fi

      - name: Run tests
        run: pytest -v --maxfail=1 --junitxml=pytest-junit.xml

      - name: Upload pytest junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: pytest-junit.xml

  build:
    name: Build wheel (main)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --no-isolation

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl

