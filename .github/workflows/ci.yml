name: CI

on:
  push:
    branches: ["main", "test"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale runs on test/PRs, but let every main run finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint & Test
    runs-on: ${{ matrix.os }}
    env:
      # PyQt6 widget tests construct a QApplication; the runners are headless,
      # so force Qt's offscreen platform plugin (no X/Wayland display needed).
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system libraries (Linux)
        # PyQt6's offscreen platform plugin needs libEGL/libGL/xkbcommon/dbus,
        # and sounddevice needs libportaudio2 — none are on a bare runner.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libportaudio2

      - name: Install CPU-only torch (Linux)
        # PyPI's Linux torch is the CUDA build (~2.6 GB with the nvidia-* libs);
        # no test needs a GPU, so pre-satisfy the `server` extra's torch pin.
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,client]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest --junitxml=pytest-junit.xml

      - name: Upload pytest junit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest-junit.xml

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Check bundled package data
        # Icons and built-in command YAML must ship inside the wheel; a
        # non-editable install silently loses them otherwise.
        run: |
          python -m zipfile -l dist/*.whl > contents.txt
          for f in wispr_dragon/assets/mic_on.png wispr_dragon/data/default_commands.yaml; do
            grep -q "$f" contents.txt || { echo "missing from wheel: $f"; exit 1; }
          done

      - name: Upload dist
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*.whl
